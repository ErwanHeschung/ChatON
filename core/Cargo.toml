[package]
name = "chaton-core"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
futures-core = "0.3"
getrandom = "0.3"
hex = "0.4"
keyring-core = "1"
# Voice (spec § 11): only the app joins rooms; `cargo test` stays light without it.
# glib-main-loop: the screen capturer on Wayland (the desktop portal).
livekit = { version = "=0.11.0", default-features = false, features = ["native", "rustls-tls-webpki-roots", "glib-main-loop"], optional = true }
# Screen share frames for the webview (voice).
jpeg-encoder = { version = "0.6", features = ["simd"], optional = true }
nostr = { version = "0.45", default-features = false, features = ["std", "nip44", "nip49", "nip59", "nip98", "os-rng"] }
nostr-blossom = "0.45"
nostr-sdk = "0.45"
nostr-sqlite = "0.45"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
spake2 = "0.4"
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[features]
voice = ["dep:livekit", "dep:jpeg-encoder"]

[dev-dependencies]
secp256k1 = "0.30"
tokio = { version = "1", features = ["time"] }

# NIP-49 (scrypt) is ~50x slower unoptimized: keeps `cargo test` and debug builds fast.
[profile.dev.package.scrypt]
opt-level = 3
