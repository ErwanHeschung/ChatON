[package]
name = "chaton-core"
version = "0.1.0"
edition = "2024"

[dependencies]
keyring-core = "1"
nostr = { version = "0.45", default-features = false, features = ["std", "nip44", "nip49", "nip59", "os-rng"] }
thiserror = "2.0.21"

[dev-dependencies]
secp256k1 = "0.30"
serde_json = "1.0.154"

# NIP-49 (scrypt) is ~50x slower unoptimized: keeps `cargo test` and debug builds fast.
[profile.dev.package.scrypt]
opt-level = 3
