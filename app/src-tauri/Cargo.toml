[package]
name = "chaton-app"
version = "0.1.0"
description = "ChatON desktop and mobile client"
edition = "2024"
rust-version = "1.90"

[lib]
name = "chaton_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
chaton-core = { path = "../../core", features = ["voice"] }
keyring-core = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = "1"

# NIP-49 (scrypt) is ~50x slower unoptimized.
[profile.dev.package.scrypt]
opt-level = 3
