<app-chat-layout>
  <app-community-rail rail></app-community-rail>

  <router-outlet sidebar name="left-sidebar"></router-outlet>
  <app-user-panel account></app-user-panel>

  <app-chat-header header></app-chat-header>

  <app-chat
    chat
    [messages]="messages()"
    [disabled]="inChannel() ? false : !dm.selected()"
    [error]="inChannel() ? community.sendError() : dm.sendError()"
    (send)="send($event)"
    (file)="sendFile($event)"
    (remove)="remove($event)"
  ></app-chat>

  <app-users-list members></app-users-list>
</app-chat-layout>

@if (shell.settings()) {
  <app-settings />
}
