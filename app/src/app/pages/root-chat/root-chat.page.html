<app-chat-layout>
  <app-horizontal-list header></app-horizontal-list>

  <div left class="left">
    <router-outlet name="left-sidebar"></router-outlet>
  </div>

  <app-chat
    chat
    [messages]="messages()"
    [disabled]="!dm.selected()"
    [error]="dm.sendError()"
    (send)="dm.send($event)"
  ></app-chat>

  <app-users-list right></app-users-list>
</app-chat-layout>
