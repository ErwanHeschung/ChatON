<app-chat-layout>
  <app-horizontal-list header></app-horizontal-list>

  <div left class="left">
    <router-outlet name="left-sidebar"></router-outlet>
  </div>

  <app-chat
    chat
    [messages]="messages()"
    [disabled]="inChannel() ? false : !dm.selected()"
    [error]="inChannel() ? null : dm.sendError()"
    (send)="send($event)"
    (remove)="remove($event)"
  ></app-chat>

  <app-users-list right></app-users-list>
</app-chat-layout>
