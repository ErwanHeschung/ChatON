@if (store.current(); as community) {
  <button type="button" class="trigger" [cdkMenuTriggerFor]="menu">
    <h2>{{ community.name }}</h2>
    <svg [lucideIcon]="icons.chevron" size="18"></svg>
  </button>

  <ng-template #menu>
    <div class="menu" cdkMenu>
      @if (store.can('create_invite')) {
        <button class="menu-item" cdkMenuItem (cdkMenuItemTriggered)="invite()">
          <svg [lucideIcon]="icons.invite" size="16"></svg>
          <ng-container i18n="@@community.invite">Invite</ng-container>
        </button>
      }
      @if (canSettings()) {
        <button
          class="menu-item"
          cdkMenuItem
          (cdkMenuItemTriggered)="shell.serverSettings.set(true)"
        >
          <svg [lucideIcon]="icons.settings" size="16"></svg>
          <ng-container i18n="@@community.settings">Community settings</ng-container>
        </button>
      }
      <!-- The owner can't leave (spec § 9): they transfer it first, in the settings. -->
      @if (!store.isOwner()) {
        <button class="menu-item danger" cdkMenuItem (cdkMenuItemTriggered)="leave()">
          <svg [lucideIcon]="icons.leave" size="16"></svg>
          <ng-container i18n="@@community.leave-menu">Leave the community</ng-container>
        </button>
      }
    </div>
  </ng-template>
}
