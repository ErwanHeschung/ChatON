@if (store.current(); as community) {
  <button type="button" class="trigger" [cdkMenuTriggerFor]="menu">
    <h2>{{ community.name }}</h2>
    <svg [lucideIcon]="icons.chevron" size="18"></svg>
  </button>

  <ng-template #menu>
    <div class="menu" cdkMenu>
      @if (store.can('create_invite')) {
        <button class="menu-item" cdkMenuItem (cdkMenuItemTriggered)="invite()">
          <svg [lucideIcon]="icons.invite" size="16"></svg>
          <ng-container i18n="@@community.invite">Invite</ng-container>
        </button>
      }
      @if (store.can('manage_channels')) {
        <button class="menu-item" cdkMenuItem (cdkMenuItemTriggered)="createCategory()">
          <svg [lucideIcon]="icons.category" size="16"></svg>
          <ng-container i18n="@@category.create-title">Create a category</ng-container>
        </button>
      }
      @if (canSettings()) {
        <button
          class="menu-item"
          cdkMenuItem
          (cdkMenuItemTriggered)="shell.serverSettings.set(true)"
        >
          <svg [lucideIcon]="icons.settings" size="16"></svg>
          <ng-container i18n="@@community.settings">Community settings</ng-container>
        </button>
      }
      <!-- This device only (spec § 9, Non-lus et notifications). -->
      <div class="group" cdkMenuGroup role="group" aria-labelledby="notify-label">
        <span class="label" id="notify-label">
          <svg [lucideIcon]="icons.bell" size="14"></svg>
          <ng-container i18n="@@notify.title">Notifications</ng-container>
        </span>
        @for (level of levels; track level.id) {
          <button
            class="menu-item"
            cdkMenuItemRadio
            [cdkMenuItemChecked]="community.notify === level.id"
            (cdkMenuItemTriggered)="store.setNotifyLevel(level.id)"
          >
            @if (community.notify === level.id) {
              <svg [lucideIcon]="icons.check" size="16"></svg>
            } @else {
              <span class="unchecked"></span>
            }
            {{ level.label }}
          </button>
        }
      </div>
      <!-- The owner can't leave (spec § 9): they transfer it first, in the settings. -->
      @if (!store.isOwner()) {
        <button class="menu-item danger" cdkMenuItem (cdkMenuItemTriggered)="leave()">
          <svg [lucideIcon]="icons.leave" size="16"></svg>
          <ng-container i18n="@@community.leave-menu">Leave the community</ng-container>
        </button>
      }
    </div>
  </ng-template>
}
