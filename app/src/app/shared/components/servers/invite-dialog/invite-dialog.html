<section>
  <h2 i18n="@@invite.title">Invite people to {{ store.current()?.name }}</h2>
  <p class="hint" i18n="@@invite.hint">
    Anyone with this invite can join the community, whatever their instance.
  </p>
  @if (invite(); as text) {
    <code class="key-text">{{ text }}</code>
    <button class="btn btn-primary" (click)="copy(text)">
      @if (copied()) {
        <ng-container i18n="@@community.copied">Copied</ng-container>
      } @else {
        <ng-container i18n="@@community.copy">Copy the invite</ng-container>
      }
    </button>
  } @else if (store.error(); as error) {
    <p class="error" i18n="@@community.action-failed">Not done: {{ error }}</p>
  } @else {
    <p class="hint creating">
      <app-paw-trail [length]="3" [size]="14"></app-paw-trail>
      <ng-container i18n="@@invite.creating">Creating the invite…</ng-container>
    </p>
  }
  <form class="limits" (submit)="$event.preventDefault(); create(+expiry.value, +max.value)">
    <div class="field">
      <label for="invite-expiry" i18n="@@invite.expiry">Expires after</label>
      <select #expiry id="invite-expiry">
        @for (s of expiries; track s) {
          <option [value]="'' + s" [selected]="s === 604800">
            @if (s) {
              {{ s | duration }}
            } @else {
              <ng-container i18n="@@invite.never">Never</ng-container>
            }
          </option>
        }
      </select>
    </div>
    <div class="field">
      <label for="invite-uses" i18n="@@invite.max-uses">Max uses</label>
      <select #max id="invite-uses">
        @for (n of uses; track n) {
          <option [value]="'' + n">
            @if (n) {
              {{ n }}
            } @else {
              <ng-container i18n="@@invite.no-limit">No limit</ng-container>
            }
          </option>
        }
      </select>
    </div>
    <button type="submit" class="btn" [disabled]="!invite()" i18n="@@invite.new">New link</button>
  </form>
</section>
