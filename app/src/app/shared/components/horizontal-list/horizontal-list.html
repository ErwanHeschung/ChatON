<button
  type="button"
  class="switch-view"
  (click)="switch()"
  i18n-title="@@switch-view"
  title="Switch between communities and private messages"
>
  <svg [lucideIcon]="switchIcon()" size="30" [class.is-swapping]="discussionMode() === 'DM'"></svg>
</button>

<cdk-virtual-scroll-viewport
  orientation="horizontal"
  itemSize="60"
  class="horizontal-viewport"
  appHorizontalScroll
>
  <button
    *cdkVirtualFor="let community of store.communities(); trackBy: trackById"
    type="button"
    class="horizontal-item"
    (click)="open(community.id)"
    appTooltip="{{ community.name }}"
    [attr.aria-label]="community.name"
    [class.selected]="community.id === store.selected()"
  >
    <!-- ponytail: pictures come with media (step 6b); a remote URL here would leak the IP. -->
    <span class="initial">{{ community.name.charAt(0).toUpperCase() }}</span>
  </button>
</cdk-virtual-scroll-viewport>

<button
  type="button"
  class="add-item"
  (click)="add()"
  i18n-title="@@community.add"
  title="Create or join a community"
>
  <svg [lucideIcon]="addItem" size="30"></svg>
</button>
