<span class="ring" [class.on]="speaking()">
  <app-avatar
    [picture]="user().picture"
    [name]="user().username"
    [seed]="user().id"
    [size]="size()"
    [ears]="ears()"
  ></app-avatar>
  @if (status(); as status) {
    <app-status-dot [status]="status"></app-status-dot>
  }
</span>
<span class="name" [title]="user().username" [style.color]="color()">
  @if (nick(); as nick) {
    {{ nick }} <span class="instance">{{ user().username }}</span>
  } @else {
    {{ parts()[0] }}<span class="instance">{{ parts()[1] }}</span>
  }
</span>
