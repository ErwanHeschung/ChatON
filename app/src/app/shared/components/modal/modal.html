@if (modalService.isOpen()) {
  <!-- A click on the backdrop is a mouse shortcut: the keyboard has Escape (host) and the close button. -->
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
  <div
    class="backdrop"
    (click)="modalService.close()"
    animate.enter="enter-animation"
    animate.leave="leave-animation"
  >
    <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events -->
    <div class="modal-frame" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
      <div class="modal-container">
        <button
          class="btn btn-ghost btn-icon btn-sm close"
          (click)="modalService.close()"
          i18n-title="@@modal.close"
          title="Close"
        >
          <svg [lucideIcon]="closeIcon" size="18"></svg>
        </button>
        <!-- An HTML parent: after the close icon, the dialog would be created in the SVG namespace. -->
        <div>
          <ng-container *ngComponentOutlet="modalService.activeComponent()" />
        </div>
      </div>
    </div>
  </div>
}
