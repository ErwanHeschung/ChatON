<div class="message-list">
  @for (message of messages(); track message.id) {
    <app-chat-bubble [message]="message" (remove)="remove.emit(message.id)"></app-chat-bubble>
  }
</div>

@switch (error()) {
  @case (null) {}
  @case ('too_large') {
    <small class="error" i18n="@@chat.too-large">File too large (25 MB max)</small>
  }
  @default {
    <small class="error" i18n="@@chat.send-failed">Message not sent: {{ error() }}</small>
  }
}

@if (!disabled()) {
  <app-chat-bar (send)="send.emit($event)" (file)="file.emit($event)"></app-chat-bar>
}
