<form class="search" (submit)="$event.preventDefault(); search(handle)">
  <input
    #handle
    placeholder="@pseudo@instance"
    i18n-placeholder="@@dm.search-placeholder"
    aria-label="Search a handle"
    i18n-aria-label="@@dm.search-label"
    autocomplete="off"
    spellcheck="false"
  />
</form>

@switch (dm.searchError()) {
  @case ('not_found') {
    <small class="error" i18n="@@dm.search-not-found">No one with this handle</small>
  }
  @case (null) {}
  @default {
    <small class="error" i18n="@@dm.search-failed">Couldn't reach this instance</small>
  }
}

<nav class="conversations">
  <h3 class="section-label">
    <span i18n="@@dm.section">Private messages</span>
    <button
      type="button"
      class="btn btn-ghost btn-icon btn-sm"
      (click)="newGroup()"
      i18n-title="@@group.new"
      title="New group"
    >
      <svg [lucideIcon]="newIcon" size="16"></svg>
    </button>
  </h3>
  @for (conversation of dm.conversations(); track key(conversation)) {
    <button
      type="button"
      class="list-row"
      [attr.aria-current]="key(conversation) === dm.selected() ? 'true' : null"
      (click)="open(conversation)"
    >
      <app-user-card [user]="card(conversation)"></app-user-card>
    </button>
  } @empty {
    <div class="empty">
      <app-paw-trail [length]="4" [size]="16"></app-paw-trail>
      <p class="hint" i18n="@@dm.empty">No conversations yet. Search someone above.</p>
    </div>
  }
</nav>
