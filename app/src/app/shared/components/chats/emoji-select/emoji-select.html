<input
  #search
  type="search"
  i18n-placeholder="@@emoji.search"
  placeholder="Search"
  i18n-aria-label="@@emoji.search"
  aria-label="Search"
  [value]="query()"
  (input)="query.set(search.value); list.scrollTop = 0"
/>

<nav class="tabs">
  @for (group of groups(); track group.key) {
    <button
      type="button"
      class="btn btn-ghost btn-icon btn-sm"
      [appTooltip]="group.name"
      [attr.aria-label]="group.name"
      [attr.aria-pressed]="group.key === active()"
      (click)="jump(group.key)"
    >
      <svg [lucideIcon]="icons[group.key]" size="18"></svg>
    </button>
  }
</nav>

<div #list class="list" (scroll)="track(list)" (mouseleave)="hovered.set(null)">
  @for (group of shown(); track group.key) {
    <section [attr.data-group]="group.key">
      <h3 class="section-label">{{ group.name }}</h3>
      <div class="grid">
        @for (emoji of group.emojis; track emoji.unicode) {
          <button
            type="button"
            class="emoji"
            [attr.aria-label]="emoji.label"
            (mouseenter)="hovered.set(emoji)"
            (focus)="hovered.set(emoji)"
            (click)="pick.emit(emoji.unicode)"
          >
            <img [src]="emoji.src" alt="" loading="lazy" draggable="false" />
          </button>
        }
      </div>
    </section>
  } @empty {
    @if (groups().length) {
      <p class="empty" i18n="@@emoji.none">No emoji found.</p>
    }
  }
</div>

<footer>
  @if (hovered(); as emoji) {
    <img class="preview" [src]="emoji.src" alt="" />
    <span class="label">{{ emoji.label }}</span>
  }
</footer>
