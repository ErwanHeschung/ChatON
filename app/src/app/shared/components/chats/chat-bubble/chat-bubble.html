<img ngSrc="/chatON-logo.svg" width="35" height="35" alt="" />
<div class="message-wrapper">
  <p class="username">
    {{ message().senderName }}
    @if (message().deletable) {
      @if (confirming()) {
        <button class="delete confirm" (click)="remove.emit()" i18n="@@chat.delete-confirm">
          Delete?
        </button>
      } @else {
        <button class="delete" (click)="confirming.set(true)" i18n="@@chat.delete">Delete</button>
      }
    }
  </p>
  <p class="message">{{ message().text }}</p>
</div>
