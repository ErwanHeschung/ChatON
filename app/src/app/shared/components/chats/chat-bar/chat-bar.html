<svg
  class="emoji"
  [lucideIcon]="emojiIcon"
  cdkOverlayOrigin
  #trigger="cdkOverlayOrigin"
  (click)="isPickerOpen = !isPickerOpen"
></svg>

<input
  #text
  (keydown.enter)="submit(text)"
  placeholder="Message"
  i18n-placeholder="@@chat.message-placeholder"
  aria-label="Message"
  i18n-aria-label="@@chat.message-placeholder"
/>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="trigger"
  [cdkConnectedOverlayOpen]="isPickerOpen"
  [cdkConnectedOverlayPush]="true"
  (overlayOutsideClick)="isPickerOpen = false"
>
  <app-emoji-select></app-emoji-select>
</ng-template>
