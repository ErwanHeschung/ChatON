# LiveKit next to the instance (compose.yaml, --profile voice). The key comes from LIVEKIT_KEYS.
port: 7880
rtc:
  tcp_port: 7881
  # One UDP port for every call: the only one to open in the firewall.
  udp_port: 7882
  use_external_ip: true
webhook:
  api_key: chaton
  urls:
    - http://chaton:8080/api/voice/webhook
# Who's speaking, near live (see server/livekit.dev.yaml).
audio:
  update_interval: 100
  smooth_intervals: 1
